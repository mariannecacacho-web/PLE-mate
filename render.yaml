services:
  - type: web
    name: ple-mate
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
    disk:
      name: ple-mate-data
      mountPath: /opt/render/project/src
      sizeGB: 1

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLE-mate</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="brand">✨ <span>PLE-mate</span></div><nav class="nav" id="nav"><button data-page="dashboard" class="active">🏠 Dashboard</button><button data-page="pet">🐉 PLE-mate</button><button data-page="oplan">🎯 Oplan PLE</button><button data-page="calendar">📅 Calendar</button><button data-page="corkboard">📌 Corkboard</button><button data-page="subjects">📚 Subjects</button><button data-page="settings">⚙️ Settings</button></nav><div class="profile">☼　👩🏻 Marianne ▾</div></header><main id="app"></main>
<template id="dashboard"><section class="dashboard page"><div class="main-col"><div class="hero-grid"><div class="card hero-card"><div class="hero-art"><img src="hikari.png"><div id="heroBubble" class="bubble"></div></div></div><div class="card countdown"><div class="kicker">⭐ PLE COUNTDOWN</div><div id="countdown" class="countdown-num"></div><div class="date-row" id="pleDateText"></div><div class="muted" id="nowText"></div></div><div class="card gift"><div class="kicker">🎁 TODAY'S GIFT</div><div class="gift-icon" id="giftIcon"></div><h3 id="giftName"></h3><p id="giftDesc"></p><button id="claimGift" class="primary">Claim Gift</button></div></div>
<div class="grid-main"><div class="stack"><section class="card"><div class="head"><h2>📖 Subject Tracker</h2><span>Total studied: <b id="studiedTotal"></b> · Remaining: <b id="remainingTotal"></b></span></div><div id="subjectRows"></div><button class="full" data-go="subjects">View all 12 subjects →</button></section><section class="card"><div class="head"><h2>🍅 Pomodoro Corner</h2><span id="pomoStatus">Ready</span></div><div class="pomo"><div id="pomoRing" class="pomo-ring"><div class="pomo-inner"><div id="pomoTime">25:00</div><small id="pomoMode">Focus Session</small></div></div><div class="pomo-lengths"><button data-pomo-length="25" class="pomo-choice active">25m</button><button data-pomo-length="45" class="pomo-choice">45m</button><button data-pomo-length="100" class="pomo-choice">100m</button></div><div><button id="pomoStart" class="primary">Start</button><button id="pomoPause" class="soft">Pause</button><button id="pomoReset" class="soft">Reset</button></div><small id="pomoReward">25 min = +25 coins · +5 energy</small></div></section><section class="three"><section class="card"><div class="head"><h2>📈 Weekly Study Hours</h2></div><div id="bars" class="bars"></div></section><section class="card"><div class="head"><h2>🎓 Topnotch</h2></div><p>Continue where you left off.</p><a class="primary wide" href="https://web-production-38b56.up.railway.app/login" target="_blank">Open Topnotch ↗</a></section><section class="card"><div class="head"><h2>🌿 Wellness Tip</h2></div><p id="wellness"></p><ul><li>5 slow breaths</li><li>Stretch 3–5 min</li><li>Hydrate</li><li>Short walk if helpful</li></ul></section></section></div><div class="stack"><section class="card"><div class="head"><h2>📋 Study Guide</h2><span>From Oplan PLE</span></div><div id="studyGuide"></div><button class="full" data-go="oplan">Open Study Guide →</button></section><section class="card"><div class="head"><h2>🎯 Today's Focus</h2><span id="focusMeta"></span></div><div id="focus"></div></section><section class="card"><div class="head"><h2>📊 Performance</h2></div><div id="performance"></div></section></div></div></div>
<aside class="rail"><section class="pet-mini card"><div class="pet-mini-head"><div><div class="script">PLE-mate</div><div class="muted">Your mystical study companion</div></div></div><div id="railPetWrap" class="rail-pet-wrap"><img id="railPet" class="rail-pet" src="hikari.png"><div id="petStateTag" class="pet-state-tag">Tired & dusty</div></div><div class="rail-name"><b>Hikari</b><span id="railStage"></span></div><div class="xp"><div id="xpBar"></div></div><div class="pet-care-note" id="careMessageMini"></div><div class="pet-stats"><div>⚡<b id="energy"></b><small>Energy</small></div><div>🪙<b id="coins"></b><small>Coins</small></div><div>💎<b id="gems"></b><small>Gems</small></div></div><div class="care-actions"><button data-pet-care="feed">🍚<br>Feed</button><button data-pet-care="pet">🐾<br>Pet</button><button data-pet-care="shower">💧<br>Shower</button></div><div class="mini-lore"><b>Hikari · The Celestial Kitsune</b><p>Born from starlight on a night of determination, Hikari follows your PLE journey and grows brighter with your consistency.</p><div class="qualities"><span>Loyal</span><span>Wise</span><span>Resilient</span><span>Intuitive</span><span>Lucky</span></div></div></section><section class="chat-box card"><div class="head"><h2>💬 PLE-mate</h2><span>● Online</span></div><div id="chatLog" class="chat-log"></div><form id="chatForm" class="chat-form"><textarea id="chatInput" rows="2" placeholder="Message PLE-mate..."></textarea><button class="send">➤</button></form><div class="quick"><button data-chat="What should I study?">What should I study?</button><button data-chat="How am I doing?">How am I doing?</button><button data-chat="Quick progress">Quick progress</button><button data-chat="Quick log">Quick log</button></div></section></aside></section></template>
<template id="pet"><section class="page pet-page"><div class="pet-layout"><section class="card pet-hero"><div class="pet-big-wrap"><img id="petImage" src="evolution_1.png" class="pet-big"><div id="petCondition" class="pet-state-tag"></div></div><div><h1 class="script big">Hikari</h1><div class="subtitle">The Celestial Kitsune</div><p class="lore">Born from the stars on a night of determination, Hikari walks beside you through the PLE journey. She is fed by consistency, strengthened by effort, and shines brighter every time you show up for yourself.</p><div class="quality-list"><span>Loyal</span><span>Wise</span><span>Resilient</span><span>Intuitive</span><span>Lucky</span><span>Encouraging</span></div><div class="pet-stats bigstats"><div>⚡<b id="petEnergy"></b><small>Energy</small></div><div>🪙<b id="petCoins"></b><small>Coins</small></div><div>💎<b id="petGems"></b><small>Gems</small></div><div>✨<b id="petXp"></b><small>XP</small></div></div></div></section><section class="card evolution"><div class="head"><h2>✨ Evolution</h2><span id="stageLabel"></span></div><div id="evoRow" class="evo-row"></div><div class="xp"><div id="petXpBar"></div></div><p id="nextStage" class="muted"></p><p id="petCareMessage" class="care-message"></p></section><section class="card care"><div class="head"><h2>💗 Care for Hikari</h2><span>Use Energy</span></div><div class="care-grid"><button data-pet-care="feed">🍚<b>Feed</b><small>-10 Energy</small></button><button data-pet-care="pet">🐾<b>Pet</b><small>-5 Energy</small></button><button data-pet-care="shower">💧<b>Shower</b><small>-15 Energy</small></button></div><div id="careMessage" class="care-message"></div></section><section class="card"><h2>🎁 Study → Rewards</h2><p>Every completed hour you study gives Hikari rewards.</p><div class="reward-line"><span>⚡ +10 Energy</span><span>🪙 +50 Coins</span><span>✨ +100 XP</span></div><div class="muted">Rewards are granted once per newly completed hour and saved locally.</div></section></div></section></template>
<template id="oplan"><section class="page"><div class="page-title"><div><h1>🎯 Oplan PLE</h1><p>Daily tasks, weekly priorities, wellness, motivation and accountability.</p></div></div><div class="oplan-grid"><section class="card"><div class="head"><h2>Today</h2><span>Recommended tasks</span></div><div id="oplanToday"></div></section><section class="card"><div class="head"><h2>This Week</h2><span>Priority order</span></div><div id="oplanWeek"></div></section><section class="card"><div class="head"><h2>Study Better</h2></div><div id="tips"></div></section><section class="card"><div class="head"><h2>Accountability</h2></div><div id="accountability"></div></section></div></section></template>
<template id="calendar"><section class="page"><div class="page-title"><div><h1>📅 Calendar</h1><p>Read-only calendar used by Oplan PLE as a schedule constraint.</p></div></div><section class="card"><div class="head"><h2>Integrated calendar</h2><span>Local / read-only</span></div><div id="calendarEmbed" class="calendar-embed"></div><div id="calendarEvents"></div></section></section></template>
<template id="corkboard"><section class="page"><div class="page-title"><div><h1>📌 Corkboard</h1><p>Hikari may leave a message; sometimes Aoi the Cloud Owl may visit too.</p></div><div><button class="primary" id="addNote">+ Note</button><label class="soft file">+ Photo<input id="boardImage" type="file" accept="image/*" hidden></label></div></div><div class="card friend-area"><img src="aoi.png"><div><b>Aoi · The Cloud Owl</b><p>Hikari's friend. Every so often, Aoi leaves you a little reminder to rest, reset, and keep going.</p></div></div><div id="board" class="board"></div></section></template>
<template id="subjects"><section class="page"><div class="page-title"><div><h1>📚 Subjects</h1><p>Click a subject to open a detailed floating overview.</p></div><button id="addSubject" class="primary">+ Subject</button></div><div id="subjectCards" class="subject-cards"></div><div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><div id="modalBody"></div></div></div></section></template>
<template id="settings"><section class="page"><div class="page-title"><div><h1>⚙️ Settings</h1><p>Local-first, including calendar URL.</p></div></div><div class="settings-grid"><section class="card"><h2>PLE date</h2><input id="pleDateInput" type="datetime-local"><h2>Calendar integration</h2><label>Google Calendar embed URL</label><input id="calendarUrl" type="url" placeholder="https://calendar.google.com/calendar/embed?..."><button id="saveCalendar" class="primary">Save Calendar</button><p class="muted">The URL is stored in this browser and is not written into the GitHub repository.</p></section><section class="card"><h2>Memory</h2><button id="exportData" class="primary">Export Backup</button><label class="soft file">Import Backup<input id="importData" type="file" accept=".json" hidden></label><h2>Clear everything</h2><button id="clearData" class="danger">Clear all PLE-mate data</button></section></div></section></template>
<script src="app.js"></script></body></html>
